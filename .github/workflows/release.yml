name: release

# Publishing a GitHub Release with a tag like v1.2.0 (or pushing that tag) tests the code,
# builds the downloads and attaches them to the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - name: Tag matches VERSION file
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - run: python tests/run_tests.py
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v3
        with:
          name: Color Space Transform mk2 ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          overwrite_files: true
          files: |
            dist/Color-Space-Transform-mk2.dctl
            dist/Color-Remap-mk2.dctl
            dist/Color-Space-Transform-mk2-Installer.zip
            dist/Color-Space-Transform-mk2-DCTL-only.zip
            dist/SHA256SUMS.txt
